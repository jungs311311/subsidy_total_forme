name: 기업·개인 보조금 매일 갱신

on:
  schedule:
    - cron: "23 22 * * *" # 매일 한국시간 오전 7시 23분, 원본의 오전 6시 갱신 이후
  workflow_dispatch:
    inputs:
      mode:
        description: "auto: 키가 있으면 API, 없으면 원본 데이터 동기화 / api: 직접 호출만 / mirror: 원본 동기화만"
        type: choice
        options: [auto, api, mirror]
        default: auto
  push:
    paths:
      - '.github/workflows/update-all.yml'
      - 'scripts/**'
      - 'business/scripts/**'
      - 'personal/scripts/**'

permissions:
  contents: write

concurrency:
  group: subsidy-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 공고문 분석 도구 설치
        run: python -m pip install olefile pypdf
      - name: 파이썬 코드 구문 검사
        run: python -m compileall -q scripts business/scripts personal/scripts
      - name: API 수집 또는 원본 공개 데이터 동기화
        env:
          UPDATE_MODE: ${{ inputs.mode || 'auto' }}
          BIZINFO_KEY: ${{ secrets.BIZINFO_KEY }}
          GOV24_KEY: ${{ secrets.GOV24_KEY || secrets.ODCLOUD_KEY }}
          BOKJIRO_KEY: ${{ secrets.BOKJIRO_KEY || secrets.GOV24_KEY || secrets.ODCLOUD_KEY }}
          YOUTH_KEY: ${{ secrets.YOUTH_KEY }}
        run: python scripts/update_all.py --mode "$UPDATE_MODE"
      - name: 바뀐 데이터 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business/data personal/data
          if [ -d data ]; then git add data; fi
          if ! git diff --staged --quiet; then
            git commit -m "기업·개인 지원금 데이터 갱신 $(TZ=Asia/Seoul date '+%F %H:%M')"
            git pull --rebase origin main
            git push
          fi
